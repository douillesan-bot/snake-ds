name: Build NDS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4

      - name: Installer libnds et les exemples
        run: dkp-pacman -Sy --noconfirm --needed nds-dev nds-examples

      - name: Compiler
        run: |
          set -e
          TPL=$(find /opt/devkitpro/examples/nds -type d -path '*templates/arm9' | head -n 1)
          echo "Modele utilise : $TPL"
          if [ -z "$TPL" ]; then echo "Modele introuvable"; exit 1; fi
          mkdir out
          cp -r "$TPL"/. out/
          rm -rf out/source/*
          cp source/main.c out/source/main.c
          cd out
          make
          cp *.nds ../snakeds.nds

      - name: Envoyer le fichier .nds
        uses: actions/upload-artifact@v4
        with:
          name: snakeds
          path: snakeds.nds
